[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exhalepath"
version = "0.1.0"
description = "Pathway-informed exhaled VOC prediction (ppb) across diseases and tumor contexts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ExhalePath contributors" }]
dependencies = [
  "requests>=2.31",
  "pandas>=2.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "joblib>=1.3",
  "tqdm>=4.66",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
census = ["cellxgene-census>=1.18.0"]

[project.scripts]
exhalepath = "exhalepath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

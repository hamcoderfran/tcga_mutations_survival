[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exhalepath-atlas"
version = "1.0.0"
description = "ExhalePath Atlas: priority 1–14 datasources + whole-body exhaled VOC biomarker prediction across 100+ diseases"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ExhalePath Atlas contributors" }]
dependencies = [
  "requests>=2.31",
  "pandas>=2.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "joblib>=1.3",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "openpyxl>=3.1"]
census = ["cellxgene-census>=1.18.0"]

[project.scripts]
exhalepath = "exhalepath.cli:main"
exhalepath-atlas = "exhalepath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voc-breath"
version = "1.6.0"
description = "voc: exhaled VOC biomarker prediction, 20-model Great Disease Stack, and GC-MS patient diagnostic research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ExhalePath Atlas contributors" }]
keywords = ["VOC", "breath", "metabolomics", "biomarker", "exhalepath"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "requests>=2.31",
  "pandas>=2.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "umap-learn>=0.5",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "joblib>=1.3",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "xlrd>=2.0.1",
  "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "openpyxl>=3.1", "build>=1.0"]
census = ["cellxgene-census>=1.18.0"]
stack = ["networkx>=3.0"]
# Optional full GSMM FBA (Human-GEM / Recon3D) — large download, not required for flux proxy
gsmm = ["cobra>=0.29"]
# Optional light NL backends use HTTP only (requests already required).
# Install Ollama separately and pull e.g. `ollama pull qwen2.5:0.5b`.
llm = []

[project.urls]
Homepage = "https://github.com/hamcoderfran/tcga_mutations_survival"
Repository = "https://github.com/hamcoderfran/tcga_mutations_survival"

[project.scripts]
voc = "exhalepath.cli:main"
exhalepath = "exhalepath.cli:main"
exhalepath-atlas = "exhalepath.cli:main"
voc-breath = "exhalepath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exhalepath = [
  "data/knowledge/*.json",
  "data/knowledge/**/*",
  "data/knowledge/gcms_diagnostic/**/*",
  "data/knowledge/gcms_splits/*",
  "data/great_stack/*",
  "data/census/*",
  "data/models/*",
  "data/clinical_comorbidity/*.json",
  "data/real_breath/**/*",
  "data/public_breath/*",
  "data/datasources/metabolomics/**/*",
  "data/datasources/malaria_external/**/*",
  "data/processed/*",
  "data/cache/.gitkeep",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
